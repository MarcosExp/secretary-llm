# Base stack: the app is published on the host's loopback only.
# Expose it to your tailnet with the host's Tailscale (tailscale serve), see docs/OPERATIONS.md,
# or add the bundled sidecar: docker compose -f docker-compose.yml -f compose.tailscale.yml up -d

x-hardening: &hardening
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build: .
    environment:
      SECRETARY_DB_PATH: /data/secretary.db
      SECRETARY_TIMEZONE: ${SECRETARY_TIMEZONE:-UTC}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRETARY_ORCHESTRATOR_MODEL: ${SECRETARY_ORCHESTRATOR_MODEL:-}   # empty: config.yaml, else haiku
      SECRETARY_CONFIG: /config/config.yaml
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_CALENDAR_ID:+/secrets/google-service-account.json}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      APP_HOST: 0.0.0.0   # inside the container; the host side is bound to 127.0.0.1 below
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ${SECRETARY_DATA_DIR:?set SECRETARY_DATA_DIR in .env}/db:/data
      - ${SECRETARY_DATA_DIR:?set SECRETARY_DATA_DIR in .env}/config:/config:ro
      - ${SECRETARY_DATA_DIR:?set SECRETARY_DATA_DIR in .env}/secrets:/secrets:ro
      - ${SECRETARY_DATA_DIR:?set SECRETARY_DATA_DIR in .env}/models:/models

  # Bucket settings are not required to start the stack, so the app can run before
  # backups are configured. Without them this container exits with an error and keeps
  # restarting, which shows in `docker compose ps`: backups never fail silently.
  litestream:
    <<: *hardening
    image: litestream/litestream:0.3.13
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-auto}
    volumes:
      - ${SECRETARY_DATA_DIR:?set SECRETARY_DATA_DIR in .env}/db:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

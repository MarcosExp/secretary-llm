<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secretary</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141a2b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="/static/icons/icon.svg" alt="">
      <h1>Secretary</h1>
    </div>
    <nav>
      <a id="dashboard-link" href="/dashboard" class="ghost nav-btn"></a>
      <a id="csv-link" href="/api/logs.csv" download class="ghost nav-btn"></a>
      <button id="new-chat" type="button" class="ghost nav-btn"></button>
    </nav>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form id="composer" autocomplete="off">
    <button id="mic" type="button" class="icon" aria-label="Record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <textarea id="input" rows="1" required></textarea>
    <button id="send" type="submit" class="icon" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9Z"/></svg>
    </button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>

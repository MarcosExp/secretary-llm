name: studies
description: >
  Studies: courses, exam dates, study units (topics) with estimated and done hours,
  confidence per unit, and coursework tasks (assignments, exercises, lab reports),
  which it creates linked to their course. Use it to log study time, check study
  progress or exams, and add any task that belongs to a course.
version: 1
model: haiku
reads: [core_tasks]

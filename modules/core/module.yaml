name: core
description: >
  Tasks and life areas. Adds, lists, updates, completes and archives tasks with
  priority (P1 today, P2 this week, P3 someday), area, due date, time estimate
  and notes. Use it for to-dos, deadlines and what is pending, except coursework
  for a specific course (assignments, exercises, lab reports): send that to studies
  so the task is linked to its course.

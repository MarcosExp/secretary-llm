[project]
name = "secretary"
version = "0.1.0"
description = "Personal organization agent: tasks, studies and calendar, by text and voice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
secretary = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "modules*"]

[tool.setuptools.package-data]
modules = ["*/migrations/*.sql", "*/seed_example.sql"]

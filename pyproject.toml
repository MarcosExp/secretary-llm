[project]
name = "secretary"
version = "0.1.0"
description = "Personal organization agent: tasks, studies and calendar, by text and voice."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tzdata",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
subscription = [
    "claude-agent-sdk>=0.2.161",   # bundles the Claude Code CLI (~250 MB)
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
secretary = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "modules*"]

[tool.setuptools.package-data]
app = ["agent/prompts/*.md"]
modules = ["*/migrations/*.sql", "*/seed_example.sql", "*/module.yaml", "*/prompt.md"]

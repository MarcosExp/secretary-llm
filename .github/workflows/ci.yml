name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history, not just the last commit
      # Run the CLI directly: gitleaks-action scans "<first pushed>^..<last>",
      # which fails when the push includes the root commit.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact -v

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,subscription,voice]"
      - run: pytest -q

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      SECRETARY_DATA_DIR: /tmp/secretary-data
      LITESTREAM_ACCESS_KEY_ID: dummy
      LITESTREAM_SECRET_ACCESS_KEY: dummy
      LITESTREAM_BUCKET: dummy
      LITESTREAM_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f compose.tailscale.yml config --quiet
        env:
          TS_AUTHKEY: dummy
